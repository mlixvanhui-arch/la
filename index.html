<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错误演示</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Microsoft YaHei",sans-serif;
}

body{
    overflow:hidden;
    background:#111;
}

.popup{
    position:absolute;
    width:280px;
    background:white;
    border:2px solid #666;
    box-shadow:0 0 20px rgba(0,0,0,.4);
    animation:shake .15s infinite;
}

.title{
    background:linear-gradient(90deg,#0057d8,#3b82f6);
    color:white;
    padding:6px 10px;
    font-size:14px;
    font-weight:bold;
}

.content{
    padding:20px;
    text-align:center;
    font-size:20px;
}

.btn{
    text-align:center;
    padding-bottom:15px;
}

.btn button{
    padding:5px 18px;
}

@keyframes shake{
    0%{transform:translate(0);}
    25%{transform:translate(-2px,2px);}
    50%{transform:translate(2px,-2px);}
    75%{transform:translate(-2px,-2px);}
    100%{transform:translate(2px,2px);}
}

#bsod{
    display:none;
    position:fixed;
    inset:0;
    background:#0078d7;
    color:white;
    padding:8%;
}

#bsod h1{
    font-size:120px;
    margin-bottom:30px;
}

#bsod p{
    font-size:28px;
    line-height:1.8;
}
</style>
</head>
<body>

<div id="bsod">
    <h1>:(</h1>
    <p>你的手机遇到问题，将要爆炸。</p>
    <p>错误码：都是拉</p>
    <p>点燃电池中... 100%</p>
</div>

<script>
let start = Date.now();

function createPopup(){

    const pop = document.createElement("div");
    pop.className = "popup";

    pop.style.left =
        Math.random()*(window.innerWidth-300)+"px";

    pop.style.top =
        Math.random()*(window.innerHeight-150)+"px";

    const colors = [
        "#0057d8",
        "#d80000",
        "#008000",
        "#8000ff",
        "#ff6600"
    ];

    pop.innerHTML = `
        <div class="title"
             style="background:${colors[Math.floor(Math.random()*colors.length)]}">
             系统错误
        </div>

        <div class="content">
            ❌ 孙诗璇是拉拉
        </div>

        <div class="btn">
            <button>确定</button>
        </div>
    `;

    document.body.appendChild(pop);
}

const interval = setInterval(()=>{

    for(let i=0;i<4;i++){
        createPopup();
    }

    if(Date.now()-start>5000){

        clearInterval(interval);

        document.querySelectorAll(".popup")
            .forEach(e=>e.remove());

        document.body.style.background="#0078d7";

        document.getElementById("bsod")
            .style.display="block";
    }

},100);
</script>

</body>
</html>
